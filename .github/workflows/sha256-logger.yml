name: TR-AI Logbook - Tamper-proof

on:
  push:
    paths:
      - 'logs/**/*.pdf'
      - 'research/**/*.pdf'

jobs:
  hash-and-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SHA256 manifest
        run: |
          echo "# TR-AI Research Logbook - SHA256 Manifest" > MANIFEST.md
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> MANIFEST.md
          echo "" >> MANIFEST.md
          echo "| datetime | file | sha256 |" >> MANIFEST.md
          echo "|---|---|---|" >> MANIFEST.md
          for f in $(find logs research -name "*.pdf" | sort); do
            HASH=$(sha256sum "$f" | awk '{print $1}')
            echo "| $(date -u +"%Y-%m-%dT%H:%M:%SZ") | $f | $HASH |" >> MANIFEST.md
          done
          cat MANIFEST.md

      - name: Append to logbook.jsonl
        run: |
          # 新しいPDFだけを検出してJSONLに追記する簡易版
          # 実際は差分を見て追記する形に拡張できます
          ls -lh logs/*.pdf research/**/*.pdf 2>/dev/null || true

      - name: Commit manifest
        run: |
          git config user.name "TR-AI Logbot"
          git config user.email "logbot@choiizuka.com"
          git add MANIFEST.md
          git diff --staged --quiet || git commit -m "auto: update SHA256 manifest [skip ci]"
          git push
